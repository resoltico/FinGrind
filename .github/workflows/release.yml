name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build, publish, and verify (for example v0.25.0)
        required: true
        type: string

concurrency:
  group: release-publication
  cancel-in-progress: false
  queue: max

jobs:
  prepare-publication:
    name: Prepare release publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FINGRIND_WORKFLOW_HELPER_ROOT: "${{ github.event_name == 'workflow_dispatch' && 'workflow-owner-surface' || '.' }}"

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.target-tag.outputs.tag }}
      version: ${{ steps.target-tag.outputs.version }}
      release-asset-names-json: ${{ steps.release-plan.outputs.release-asset-names-json }}
      release-attestation-subject-paths: ${{ steps.release-plan.outputs.release-attestation-subject-paths }}
      container-image-ref: ${{ steps.release-plan.outputs.container-image-ref }}
      container-staging-image-ref: ${{ steps.release-plan.outputs.container-staging-image-ref }}
      workflow-helper-commit: ${{ steps.workflow-helper.outputs.commit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          ref: main
          path: workflow-owner-surface

      - name: Pin the rerun release-control helper commit
        if: github.event_name == 'workflow_dispatch'
        id: workflow-helper
        shell: bash
        run: |
          set -euo pipefail
          helper_commit="$(git -C workflow-owner-surface rev-parse HEAD)"
          [[ "${helper_commit}" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "${helper_commit}" >> "$GITHUB_OUTPUT"
          printf 'Release control helper commit: %s\n' "${helper_commit}"
          printf 'Release control helper commit: %s\n' "${helper_commit}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release workflow initiator
        shell: bash
        env:
          FINGRIND_RELEASE_EVENT_NAME: ${{ github.event_name }}
          FINGRIND_RELEASE_REF: ${{ github.ref }}
          FINGRIND_RELEASE_ACTOR_ID: ${{ github.actor_id }}
          FINGRIND_RELEASE_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          FINGRIND_RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FINGRIND_RELEASE_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-release-workflow-initiator.sh"

      - name: Determine target release tag
        id: target-tag
        shell: bash
        env:
          FINGRIND_RELEASE_EVENT_NAME: ${{ github.event_name }}
          FINGRIND_DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${FINGRIND_RELEASE_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${FINGRIND_DISPATCH_RELEASE_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          source "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/release-tag-support.sh"
          [ -n "${TAG}" ] || {
            echo "::error::target release tag is required"
            exit 1
          }
          release_tag_is_stable "${TAG}" || {
            echo "::error::target release tag must match stable vX.Y.Z"
            exit 1
          }
          printf 'tag=%s\n' "${TAG}" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(release_tag_version "${TAG}")" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${{ steps.target-tag.outputs.version }}"
          gradle_version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          [ "${tag_version}" = "${gradle_version}" ] || {
            echo "Tag version (${tag_version}) does not match gradle.properties version (${gradle_version})"
            exit 1
          }

      - name: Verify release candidate tag handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target-tag.outputs.tag }}
          FINGRIND_RELEASE_TAG_VERIFIER_MODE: ${{ github.event_name == 'workflow_dispatch' && 'rerun' || 'tag-publication' }}
        run: "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-release-candidate-tag.sh"

      - name: Render canonical release-publication plan
        id: release-plan
        shell: bash
        run: |
          set -euo pipefail
          plan_json="$(
            python3 "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/read-release-publication-plan.py" \
              --version "${{ steps.target-tag.outputs.version }}" \
              --repository-root "${GITHUB_WORKSPACE}" \
              --repository-owner "${{ github.repository_owner }}"
          )"
          printf 'release-asset-names-json=%s\n' "$(printf '%s' "${plan_json}" | jq -c '.releaseAssetNames')" >> "$GITHUB_OUTPUT"
          printf 'container-image-ref=%s\n' "$(printf '%s' "${plan_json}" | jq -r '.containerImageRef')" >> "$GITHUB_OUTPUT"
          printf 'container-staging-image-ref=%s\n' "$(printf '%s' "${plan_json}" | jq -r '.containerStagingImageRef')" >> "$GITHUB_OUTPUT"
          {
            echo 'release-attestation-subject-paths<<EOF'
            printf '%s' "${plan_json}" | jq -r '.releaseAttestationSubjectPaths[]'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build-bundles:
    name: Build bundle (${{ matrix.classifier }})
    needs: prepare-publication
    runs-on: ${{ matrix.runner }}
    # Every target runs the complete published-bundle acceptance matrix. Keep the release budget
    # aligned with the equivalent CI proof so a healthy slow platform is not cancelled before its
    # archive, checksum, and attestation can be published.
    timeout-minutes: 130
    env:
      FINGRIND_WORKFLOW_HELPER_ROOT: "${{ github.event_name == 'workflow_dispatch' && 'workflow-owner-surface' || '.' }}"

    permissions:
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        # This is the runner-admission boundary. It remains literal workflow policy rather
        # than data rendered by a candidate release checkout before GitHub resolves runs-on.
        include:
          - runner: macos-15
            classifier: macos-aarch64
            archiveExtension: tar.gz
            operatingSystemId: macos
            architectureId: aarch64
          - runner: macos-15-intel
            classifier: macos-x86_64
            archiveExtension: tar.gz
            operatingSystemId: macos
            architectureId: x86_64
          - runner: ubuntu-24.04
            classifier: linux-x86_64
            archiveExtension: tar.gz
            operatingSystemId: linux
            architectureId: x86_64
          - runner: ubuntu-24.04-arm
            classifier: linux-aarch64
            archiveExtension: tar.gz
            operatingSystemId: linux
            architectureId: aarch64
          - runner: windows-2022
            classifier: windows-x86_64
            archiveExtension: zip
            operatingSystemId: windows
            architectureId: x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-publication.outputs.workflow-helper-commit }}
          path: workflow-owner-surface

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          zulu_version="$(grep '^fingrindZuluVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${zulu_version}" ]
          [ -n "${python_version}" ]
          printf 'java-version=%s\n' "${zulu_version}" >> "$GITHUB_OUTPUT"
          printf 'python-version=%s\n' "${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-python-tools.txt
            requirements-release-smoke-workflow.txt

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Provision pinned PowerShell runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $provisionedLines = @(python "$env:FINGRIND_WORKFLOW_HELPER_ROOT/scripts/provision-powershell-runtime.py" --install-root "$env:RUNNER_TEMP\fingrind-powershell")
          if ($LASTEXITCODE -ne 0 -or $provisionedLines.Count -ne 1) {
            throw 'could not provision exactly one pinned PowerShell executable'
          }
          $pwshExecutable = $provisionedLines[0].Trim()
          if ([string]::IsNullOrWhiteSpace($pwshExecutable) -or
              -not (Test-Path -LiteralPath $pwshExecutable -PathType Leaf)) {
            throw 'PowerShell provisioner did not return an existing executable'
          }
          $pwshDirectory = Split-Path -Path $pwshExecutable -Parent
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $pwshDirectory
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "FINGRIND_PWSH_EXECUTABLE=$pwshExecutable"
          $requiredVersionLines = @(python "$env:FINGRIND_WORKFLOW_HELPER_ROOT/scripts/provision-powershell-runtime.py" --print-version)
          if ($LASTEXITCODE -ne 0 -or $requiredVersionLines.Count -ne 1) {
            throw 'could not read exactly one canonical PowerShell version'
          }
          $requiredVersion = $requiredVersionLines[0].Trim()
          $actualVersionLines = @(& $pwshExecutable -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()')
          if ($LASTEXITCODE -ne 0 -or $actualVersionLines.Count -ne 1) {
            throw 'the provisioned PowerShell executable did not report exactly one version'
          }
          if ($actualVersionLines[0].Trim() -ne $requiredVersion) {
            throw "the provisioned PowerShell version does not match the canonical pin: expected $requiredVersion"
          }

      - name: Install repo-owned release-smoke Python tools on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          helper_root="${FINGRIND_WORKFLOW_HELPER_ROOT}"
          uv_version="$(grep '^fingrindUvVersion=' "${helper_root}/gradle/fingrind-build.properties" | cut -d= -f2)"
          [ -n "${uv_version}" ]
          python -m pip install --user "uv==${uv_version}"
          uv_bin_dir="$(python - <<'PY'
          import sysconfig
          print(sysconfig.get_path("scripts", scheme=sysconfig.get_preferred_scheme("user")))
          PY
          )"
          printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
          uv_executable="${uv_bin_dir}/uv"
          printf 'ORG_GRADLE_PROJECT_fingrindUvExecutable=%s\n' "${uv_executable}" >> "${GITHUB_ENV}"
          "${uv_executable}" --version
          "${uv_executable}" pip install --system \
            -r "${helper_root}/requirements-release-smoke-workflow.txt"

      - name: Install repo-owned release-smoke Python tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helperRoot = $env:FINGRIND_WORKFLOW_HELPER_ROOT
          $uvVersionLine = Select-String -Path (Join-Path $helperRoot 'gradle/fingrind-build.properties') -Pattern '^fingrindUvVersion='
          if (-not $uvVersionLine) {
            throw "missing fingrindUvVersion in $helperRoot/gradle/fingrind-build.properties"
          }
          $uvVersion = $uvVersionLine.Line.Split('=')[1]
          python -m pip install --user "uv==$uvVersion"
          $uvBinDir = python -c "import sysconfig; print(sysconfig.get_path('scripts', scheme=sysconfig.get_preferred_scheme('user')))"
          $uvExecutable = Join-Path $uvBinDir 'uv.exe'
          if (-not (Test-Path $uvExecutable)) {
            throw "uv executable was not installed at $uvExecutable"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $uvBinDir
          Add-Content -Path $env:GITHUB_ENV -Value "ORG_GRADLE_PROJECT_fingrindUvExecutable=$uvExecutable"
          & $uvExecutable --version
          & $uvExecutable pip install --system `
            -r (Join-Path $helperRoot 'requirements-release-smoke-workflow.txt')

      - name: Configure MSVC developer command environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:FINGRIND_PWSH_EXECUTABLE `
            -NoLogo `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:FINGRIND_WORKFLOW_HELPER_ROOT/scripts/setup-msvc-dev-cmd.ps1" `
            -Arch x64
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify Unix runner identity matches bundle target
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-runner-identity.py" \
            --expected-os-id '${{ matrix.operatingSystemId }}' \
            --expected-arch-id '${{ matrix.architectureId }}' \
            --actual-os-name "$(uname -s)" \
            --actual-architecture "$(uname -m)"

      - name: Build Unix self-contained CLI bundle
        if: runner.os != 'Windows'
        id: unix-bundle-build
        shell: bash
        run: |
          set -euo pipefail
          source "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/gradle-wrapper-support.sh"
          is_darwin=false
          case "$(uname -s)" in
            Darwin) is_darwin=true ;;
          esac
          manifest_path="$(fg_gradle_bundle_archive_manifest_path "$PWD" 'cli' "${is_darwin}")"
          ./gradlew :cli:bundleCliArchive \
            -PfingrindBundleClassifier=${{ matrix.classifier }} \
            --no-daemon \
            --console=plain
          archive_path="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["archivePath"])' \
              "${manifest_path}"
          )"
          checksum_path="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checksumPath"])' \
              "${manifest_path}"
          )"
          printf 'archive-path=%s\n' "${archive_path}" >> "$GITHUB_OUTPUT"
          printf 'checksum-path=%s\n' "${checksum_path}" >> "$GITHUB_OUTPUT"

      - name: Verify native Windows publication surface
        if: runner.os == 'Windows'
        id: windows-publication-proof
        shell: pwsh
        run: |
          & $env:FINGRIND_PWSH_EXECUTABLE `
            -NoLogo `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:FINGRIND_WORKFLOW_HELPER_ROOT/scripts/verify-windows-publication-surface.ps1" `
            -RepositoryRoot "${{ github.workspace }}" `
            -WorkflowHelperRoot "$env:FINGRIND_WORKFLOW_HELPER_ROOT" `
            -ExpectedOperatingSystemId '${{ matrix.operatingSystemId }}' `
            -ExpectedArchitectureId '${{ matrix.architectureId }}' `
            -BundleClassifier '${{ matrix.classifier }}' `
            -PowerShellExecutable $env:FINGRIND_PWSH_EXECUTABLE `
            -OutputFile $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Smoke test the Unix self-contained CLI bundle on the host runner
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/bundle-smoke.sh" \
            "${{ steps.unix-bundle-build.outputs.archive-path }}"

      - name: Smoke test the Linux self-contained CLI bundle on the compatibility floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/bundle-smoke.sh" \
            "${{ steps.unix-bundle-build.outputs.archive-path }}" \
            --execution-surface compatibility-floor

      - name: Attest Unix bundle build outputs
        if: runner.os != 'Windows'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ steps.unix-bundle-build.outputs.archive-path }}
            ${{ steps.unix-bundle-build.outputs.checksum-path }}

      - name: Attest Windows bundle build outputs
        if: runner.os == 'Windows'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ steps.windows-publication-proof.outputs.archive-path }}
            ${{ steps.windows-publication-proof.outputs.checksum-path }}

      - name: Upload Unix release assets for publication staging
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.classifier }}
          if-no-files-found: error
          path: |
            ${{ steps.unix-bundle-build.outputs.archive-path }}
            ${{ steps.unix-bundle-build.outputs.checksum-path }}

      - name: Upload Windows release assets for publication staging
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.classifier }}
          if-no-files-found: error
          path: |
            ${{ steps.windows-publication-proof.outputs.archive-path }}
            ${{ steps.windows-publication-proof.outputs.checksum-path }}

      - name: Write sanitized Windows failure evidence
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        env:
          FINGRIND_WINDOWS_FAILURE_EVIDENCE_DIR: ${{ runner.temp }}\fingrind-windows-failure-evidence
          FINGRIND_WINDOWS_FAILURE_EVIDENCE_ROOT: ${{ runner.temp }}
        run: |
          # This diagnostic runs in the runner-provided shell, not the pinned build runtime: a
          # failed build may have been able to alter its own temporary runtime directory.
          & "$env:FINGRIND_WORKFLOW_HELPER_ROOT/scripts/write-windows-failure-evidence.ps1" `
            -RepositoryRoot "${{ github.workspace }}" `
            -EvidenceDirectory $env:FINGRIND_WINDOWS_FAILURE_EVIDENCE_DIR `
            -TrustedEvidenceRoot $env:FINGRIND_WINDOWS_FAILURE_EVIDENCE_ROOT `
            -CommitSha "${{ github.sha }}" `
            -RunId "${{ github.run_id }}"

      - name: Upload sanitized Windows failure evidence
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-failure-evidence-${{ matrix.classifier }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\fingrind-windows-failure-evidence\fingrind-windows-failure-evidence.json
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Stage GitHub release draft assets
    needs:
      - prepare-publication
      - build-bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FINGRIND_WORKFLOW_HELPER_ROOT: "${{ github.event_name == 'workflow_dispatch' && 'workflow-owner-surface' || '.' }}"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-publication.outputs.workflow-helper-commit }}
          path: workflow-owner-surface

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Publish draft-first GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-publication.outputs.tag }}
          RELEASE_ASSET_NAMES_JSON: ${{ needs.prepare-publication.outputs.release-asset-names-json }}
        run: |
          set -euo pipefail
          mapfile -t asset_names < <(printf '%s' "${RELEASE_ASSET_NAMES_JSON}" | jq -r '.[]')
          asset_paths=()
          for asset_name in "${asset_names[@]}"; do
            asset_path="release-assets/${asset_name}"
            [ -f "${asset_path}" ] || {
              echo "missing staged release asset ${asset_path}"
              exit 1
            }
            asset_paths+=("${asset_path}")
          done
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/publish-github-release.sh" "${asset_paths[@]}"

  attest-release-assets:
    name: Attest published release assets
    needs:
      - prepare-publication
      - publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FINGRIND_WORKFLOW_HELPER_ROOT: "${{ github.event_name == 'workflow_dispatch' && 'workflow-owner-surface' || '.' }}"

    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-publication.outputs.workflow-helper-commit }}
          path: workflow-owner-surface

      - name: Download published release assets for attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-publication.outputs.tag }}
          RELEASE_ASSET_NAMES_JSON: ${{ needs.prepare-publication.outputs.release-asset-names-json }}
          FINGRIND_RELEASE_ASSET_DOWNLOAD_RETRIES: "18"
          FINGRIND_RELEASE_ASSET_DOWNLOAD_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t asset_names < <(printf '%s' "${RELEASE_ASSET_NAMES_JSON}" | jq -r '.[]')
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/download-github-release-assets.sh" \
            --repo "${GH_REPO}" \
            --tag "${RELEASE_TAG}" \
            --dir release-assets \
            --retries "${FINGRIND_RELEASE_ASSET_DOWNLOAD_RETRIES}" \
            --delay-seconds "${FINGRIND_RELEASE_ASSET_DOWNLOAD_DELAY_SECONDS}" \
            "${asset_names[@]}"

      - name: Attest published release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ needs.prepare-publication.outputs.release-attestation-subject-paths }}

  verify-release:
    name: Verify GitHub release assets
    needs:
      - prepare-publication
      - publish-release
      - attest-release-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FINGRIND_WORKFLOW_HELPER_ROOT: "${{ github.event_name == 'workflow_dispatch' && 'workflow-owner-surface' || '.' }}"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-publication.outputs.workflow-helper-commit }}
          path: workflow-owner-surface

      - name: Verify GitHub release handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-publication.outputs.tag }}
          FINGRIND_RELEASE_PAYLOAD_ROOT: ${{ github.workspace }}
          FINGRIND_GITHUB_RELEASE_VERIFY_RETRIES: "36"
          FINGRIND_GITHUB_RELEASE_VERIFY_DELAY_SECONDS: "10"
          FINGRIND_VERIFY_GITHUB_RELEASE_ALLOW_DRAFT: "true"
          FINGRIND_VERIFY_GITHUB_RELEASE_SECURITY_POLICY_MODE: "artifacts-only"
        run: "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-github-release.sh"

  build-staging-container:
    name: Build staging container (${{ matrix.classifier }})
    needs:
      - prepare-publication
      - verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      FINGRIND_WORKFLOW_HELPER_ROOT: "${{ github.event_name == 'workflow_dispatch' && 'workflow-owner-surface' || '.' }}"

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        # Container builders are separately literal because their runners also resolve before
        # any candidate-checkout script can validate the release plan.
        include:
          - runner: ubuntu-24.04
            classifier: linux-x86_64
            dockerPlatform: linux/amd64
            operatingSystemId: linux
            architectureId: x86_64
          - runner: ubuntu-24.04-arm
            classifier: linux-aarch64
            dockerPlatform: linux/arm64
            operatingSystemId: linux
            architectureId: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-publication.outputs.workflow-helper-commit }}
          path: workflow-owner-surface

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          zulu_version="$(grep '^fingrindZuluVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${zulu_version}" ]
          [ -n "${python_version}" ]
          printf 'java-version=%s\n' "${zulu_version}" >> "$GITHUB_OUTPUT"
          printf 'python-version=%s\n' "${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-python-tools.txt
            requirements-release-smoke-workflow.txt

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install repo-owned release-smoke Python tools
        shell: bash
        run: |
          set -euo pipefail
          helper_root="${FINGRIND_WORKFLOW_HELPER_ROOT}"
          uv_version="$(grep '^fingrindUvVersion=' "${helper_root}/gradle/fingrind-build.properties" | cut -d= -f2)"
          [ -n "${uv_version}" ]
          python -m pip install --user "uv==${uv_version}"
          uv_bin_dir="$(python - <<'PY'
          import sysconfig
          print(sysconfig.get_path("scripts", scheme=sysconfig.get_preferred_scheme("user")))
          PY
          )"
          printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
          uv_executable="${uv_bin_dir}/uv"
          printf 'ORG_GRADLE_PROJECT_fingrindUvExecutable=%s\n' "${uv_executable}" >> "${GITHUB_ENV}"
          "${uv_executable}" --version
          "${uv_executable}" pip install --system \
            -r "${helper_root}/requirements-release-smoke-workflow.txt"

      - name: Verify Linux runner identity matches container target
        shell: bash
        run: |
          set -euo pipefail
          python3 "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-runner-identity.py" \
            --expected-os-id '${{ matrix.operatingSystemId }}' \
            --expected-arch-id '${{ matrix.architectureId }}' \
            --actual-os-name "$(uname -s)" \
            --actual-architecture "$(uname -m)"

      - name: Resolve staged Docker build-context path
        id: docker-context
        shell: bash
        run: |
          set -euo pipefail
          source "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/gradle-wrapper-support.sh"
          printf 'path=%s\n' "$(fg_gradle_docker_context_dir "$PWD" 'cli' false)" >> "$GITHUB_OUTPUT"

      - name: Stage the Docker build context
        run: |
          ./gradlew \
            -Dfingrind.docker.target.architectureId=${{ matrix.architectureId }} \
            :cli:stageDockerBuildContext \
            --no-daemon

      - name: Verify managed SQLite CLI runtimes
        run: |
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-source-checkout-sqlite-runtime.sh"
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-direct-java-sqlite-runtime.sh"

      - name: Smoke test the Docker image before publication staging
        env:
          FINGRIND_DOCKER_SMOKE_REPO_ROOT: ${{ github.workspace }}
          FINGRIND_DOCKER_TARGET_ARCHITECTURE_ID: ${{ matrix.architectureId }}
        run: "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/docker-smoke.sh"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render staging container tag
        id: staging-tag
        shell: bash
        run: |
          set -euo pipefail
          printf 'tag=%s:%s-%s\n' \
            "${{ needs.prepare-publication.outputs.container-staging-image-ref }}" \
            "${{ needs.prepare-publication.outputs.version }}" \
            "${{ matrix.classifier }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.docker-context.outputs.path }}
          platforms: ${{ matrix.dockerPlatform }}
          push: true
          tags: ${{ steps.staging-tag.outputs.tag }}
          cache-from: type=gha,scope=release-${{ matrix.classifier }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.classifier }}
          provenance: mode=max
          sbom: true

      - name: Verify published staging container surface
        env:
          FINGRIND_VERIFY_PUBLIC_CONTAINER_LATEST: "false"
        run: |
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-public-container-surface.sh" \
            "${{ needs.prepare-publication.outputs.container-staging-image-ref }}" \
            "${{ needs.prepare-publication.outputs.version }}" \
            "${{ needs.prepare-publication.outputs.version }}-${{ matrix.classifier }}"

  promote-container:
    name: Promote public container image
    needs:
      - prepare-publication
      - build-staging-container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FINGRIND_WORKFLOW_HELPER_ROOT: "${{ github.event_name == 'workflow_dispatch' && 'workflow-owner-surface' || '.' }}"

    outputs:
      mark-latest: ${{ steps.latest-policy.outputs.mark-latest }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-publication.outputs.workflow-helper-commit }}
          path: workflow-owner-surface

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Accept the immutable public exact container
        shell: bash
        run: |
          set -euo pipefail
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/promote-container-image.sh" \
            "${{ needs.prepare-publication.outputs.container-staging-image-ref }}" \
            "${{ needs.prepare-publication.outputs.container-image-ref }}" \
            "${{ needs.prepare-publication.outputs.version }}" \
            false

      - name: Verify accepted immutable public exact container
        env:
          FINGRIND_VERIFY_PUBLIC_CONTAINER_LATEST: "false"
        run: |
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-public-container-surface.sh" \
            "${{ needs.prepare-publication.outputs.container-image-ref }}" \
            "${{ needs.prepare-publication.outputs.version }}"

      - name: Resolve latest publication policy after exact acceptance
        id: latest-policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          policy_json="$(
            python3 "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/resolve-release-latest-policy.py" \
              --release-tag "${{ needs.prepare-publication.outputs.tag }}" \
              --repository "${{ github.repository }}"
          )"
          printf 'mark-latest=%s\n' "$(printf '%s' "${policy_json}" | jq -r '.markLatest')" >> "$GITHUB_OUTPUT"

      - name: Converge latest from the accepted immutable exact container
        if: steps.latest-policy.outputs.mark-latest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/promote-container-image.sh" \
            "${{ needs.prepare-publication.outputs.container-staging-image-ref }}" \
            "${{ needs.prepare-publication.outputs.container-image-ref }}" \
            "${{ needs.prepare-publication.outputs.version }}" \
            true

      - name: Verify published public container surface
        env:
          FINGRIND_VERIFY_PUBLIC_CONTAINER_LATEST: ${{ steps.latest-policy.outputs.mark-latest }}
        run: |
          "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-public-container-surface.sh" \
            "${{ needs.prepare-publication.outputs.container-image-ref }}" \
            "${{ needs.prepare-publication.outputs.version }}"

  finalize-release:
    name: Finalize public GitHub release
    needs:
      - prepare-publication
      - promote-container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FINGRIND_WORKFLOW_HELPER_ROOT: "${{ github.event_name == 'workflow_dispatch' && 'workflow-owner-surface' || '.' }}"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-publication.outputs.workflow-helper-commit }}
          path: workflow-owner-surface

      - name: Reverify staged GitHub release handoff before public finalization
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-publication.outputs.tag }}
          FINGRIND_RELEASE_PAYLOAD_ROOT: ${{ github.workspace }}
          FINGRIND_GITHUB_RELEASE_VERIFY_RETRIES: "36"
          FINGRIND_GITHUB_RELEASE_VERIFY_DELAY_SECONDS: "10"
          FINGRIND_VERIFY_GITHUB_RELEASE_ALLOW_DRAFT: "true"
          FINGRIND_VERIFY_GITHUB_RELEASE_SECURITY_POLICY_MODE: "artifacts-only"
        run: "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-github-release.sh"

      - name: Finalize the staged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-publication.outputs.tag }}
          FINGRIND_RELEASE_MARK_LATEST: ${{ needs.promote-container.outputs.mark-latest }}
          FINGRIND_RELEASE_PAYLOAD_ROOT: ${{ github.workspace }}
        run: "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/finalize-github-release.sh"

      - name: Verify final GitHub release handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-publication.outputs.tag }}
          FINGRIND_RELEASE_PAYLOAD_ROOT: ${{ github.workspace }}
          FINGRIND_GITHUB_RELEASE_VERIFY_RETRIES: "36"
          FINGRIND_GITHUB_RELEASE_VERIFY_DELAY_SECONDS: "10"
          FINGRIND_VERIFY_GITHUB_RELEASE_SECURITY_POLICY_MODE: "artifacts-only"
        run: "${FINGRIND_WORKFLOW_HELPER_ROOT}/scripts/verify-github-release.sh"
