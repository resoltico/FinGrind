name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build, publish, and verify (for example v0.25.0)
        required: true
        type: string

concurrency:
  group: publication-${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.target-tag.outputs.tag }}
      version: ${{ steps.target-tag.outputs.version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep '^fingrindJavaVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${java_version}" ]
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Determine target release tag
        id: target-tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "${TAG}" ]; then
            echo "::error::target release tag is required"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches project version
        run: |
          TAG_VERSION="${{ steps.target-tag.outputs.version }}"
          GRADLE_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match gradle.properties version ($GRADLE_VERSION)"
            exit 1
          fi

      - name: Verify release candidate tag handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target-tag.outputs.tag }}
        run: ./scripts/verify-release-candidate-tag.sh

      - name: Converge the GitHub release object
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target-tag.outputs.tag }}
        run: ./scripts/publish-github-release.sh

  build-bundles:
    name: Build bundle (${{ matrix.classifier }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            classifier: linux-x86_64
            archive_extension: tar.gz
            expected_os: Linux
            expected_arch: x86_64
          - runner: ubuntu-24.04-arm
            classifier: linux-aarch64
            archive_extension: tar.gz
            expected_os: Linux
            expected_arch: aarch64
          - runner: macos-15
            classifier: macos-aarch64
            archive_extension: tar.gz
            expected_os: Darwin
            expected_arch: arm64
          - runner: macos-15-intel
            classifier: macos-x86_64
            archive_extension: tar.gz
            expected_os: Darwin
            expected_arch: x86_64
          - runner: windows-2022
            classifier: windows-x86_64
            archive_extension: zip
            expected_os: Windows
            expected_arch: X64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep '^fingrindJavaVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${java_version}" ]
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Verify Unix runner identity matches bundle target
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          actual_os="$(uname -s)"
          actual_arch="$(uname -m)"
          [ "${actual_os}" = "${{ matrix.expected_os }}" ] || {
            echo "Expected OS ${{ matrix.expected_os }} but runner reported ${actual_os}"
            exit 1
          }
          [ "${actual_arch}" = "${{ matrix.expected_arch }}" ] || {
            echo "Expected arch ${{ matrix.expected_arch }} but runner reported ${actual_arch}"
            exit 1
          }

      - name: Verify Windows runner identity matches bundle target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $IsWindows) {
            throw "Expected a Windows runner"
          }
          $actualArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actualArch -ne '${{ matrix.expected_arch }}') {
            throw "Expected arch ${{ matrix.expected_arch }} but runner reported $actualArch"
          }

      - name: Build Unix self-contained CLI bundle
        if: runner.os != 'Windows'
        run: |
          ./gradlew :cli:bundleCliArchive \
            -PfingrindBundleClassifier=${{ matrix.classifier }} \
            --no-daemon \
            --console=plain

      - name: Build Windows self-contained CLI bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat :cli:bundleCliArchive `
            -PfingrindBundleClassifier=${{ matrix.classifier }} `
            --no-daemon `
            --console=plain

      - name: Smoke test the Unix self-contained CLI bundle
        if: runner.os != 'Windows'
        run: |
          ./scripts/bundle-smoke.sh \
            "cli/build/distributions/fingrind-${{ needs.prepare-release.outputs.version }}-${{ matrix.classifier }}.${{ matrix.archive_extension }}"

      - name: Smoke test the Windows self-contained CLI bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\bundle-smoke.ps1 `
            "cli/build/distributions/fingrind-${{ needs.prepare-release.outputs.version }}-${{ matrix.classifier }}.${{ matrix.archive_extension }}"

      - name: Publish bundle assets to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          bash ./scripts/publish-github-release.sh \
            "cli/build/distributions/fingrind-${{ needs.prepare-release.outputs.version }}-${{ matrix.classifier }}.${{ matrix.archive_extension }}" \
            "cli/build/distributions/fingrind-${{ needs.prepare-release.outputs.version }}-${{ matrix.classifier }}.${{ matrix.archive_extension }}.sha256"

  attest-release-assets:
    name: Attest published release assets
    needs:
      - prepare-release
      - build-bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Download published release assets for attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          FINGRIND_RELEASE_ASSET_DOWNLOAD_RETRIES: "18"
          FINGRIND_RELEASE_ASSET_DOWNLOAD_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          mkdir -p release-assets
          readonly asset_names=(
            "fingrind-${RELEASE_VERSION}-linux-x86_64.tar.gz"
            "fingrind-${RELEASE_VERSION}-linux-x86_64.tar.gz.sha256"
            "fingrind-${RELEASE_VERSION}-linux-aarch64.tar.gz"
            "fingrind-${RELEASE_VERSION}-linux-aarch64.tar.gz.sha256"
            "fingrind-${RELEASE_VERSION}-macos-x86_64.tar.gz"
            "fingrind-${RELEASE_VERSION}-macos-x86_64.tar.gz.sha256"
            "fingrind-${RELEASE_VERSION}-macos-aarch64.tar.gz"
            "fingrind-${RELEASE_VERSION}-macos-aarch64.tar.gz.sha256"
            "fingrind-${RELEASE_VERSION}-windows-x86_64.zip"
            "fingrind-${RELEASE_VERSION}-windows-x86_64.zip.sha256"
          )

          for asset_name in "${asset_names[@]}"; do
            attempt=1
            until gh release download "${RELEASE_TAG}" --pattern "${asset_name}" --dir release-assets >/dev/null 2>&1; do
              if (( attempt >= FINGRIND_RELEASE_ASSET_DOWNLOAD_RETRIES )); then
                echo "failed to download published release asset ${asset_name} for attestation"
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep "${FINGRIND_RELEASE_ASSET_DOWNLOAD_DELAY_SECONDS}"
            done
          done

      - name: Attest published release assets
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: |
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-linux-x86_64.tar.gz
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-linux-x86_64.tar.gz.sha256
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-linux-aarch64.tar.gz
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-linux-aarch64.tar.gz.sha256
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-macos-x86_64.tar.gz
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-macos-x86_64.tar.gz.sha256
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-macos-aarch64.tar.gz
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-macos-aarch64.tar.gz.sha256
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-windows-x86_64.zip
            release-assets/fingrind-${{ needs.prepare-release.outputs.version }}-windows-x86_64.zip.sha256

  verify-release:
    name: Verify GitHub release assets
    needs:
      - prepare-release
      - build-bundles
      - attest-release-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Verify GitHub release handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          FINGRIND_GITHUB_RELEASE_VERIFY_RETRIES: "36"
          FINGRIND_GITHUB_RELEASE_VERIFY_DELAY_SECONDS: "10"
        run: |
          ./scripts/verify-github-release.sh \
            "fingrind-${{ needs.prepare-release.outputs.version }}-linux-x86_64.tar.gz" \
            "fingrind-${{ needs.prepare-release.outputs.version }}-linux-x86_64.tar.gz.sha256" \
            "fingrind-${{ needs.prepare-release.outputs.version }}-linux-aarch64.tar.gz" \
            "fingrind-${{ needs.prepare-release.outputs.version }}-linux-aarch64.tar.gz.sha256" \
            "fingrind-${{ needs.prepare-release.outputs.version }}-macos-x86_64.tar.gz" \
            "fingrind-${{ needs.prepare-release.outputs.version }}-macos-x86_64.tar.gz.sha256" \
            "fingrind-${{ needs.prepare-release.outputs.version }}-macos-aarch64.tar.gz" \
            "fingrind-${{ needs.prepare-release.outputs.version }}-macos-aarch64.tar.gz.sha256" \
            "fingrind-${{ needs.prepare-release.outputs.version }}-windows-x86_64.zip" \
            "fingrind-${{ needs.prepare-release.outputs.version }}-windows-x86_64.zip.sha256"
