name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep '^fingrindJavaVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${java_version}" ]
          [ -n "${python_version}" ]
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-python-tools.txt

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # On PRs, only read from the cache to avoid cache poisoning from untrusted code.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install repo-owned Python tools
        shell: bash
        run: |
          set -euo pipefail
          uv_version="$(grep '^fingrindUvVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${uv_version}" ]
          python -m pip install --user "uv==${uv_version}"
          uv_bin_dir="$(python - <<'PY'
          import sysconfig
          print(sysconfig.get_path("scripts", scheme=sysconfig.get_preferred_scheme("user")))
          PY
          )"
          printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
          uv_executable="${uv_bin_dir}/uv"
          printf 'ORG_GRADLE_PROJECT_fingrindUvExecutable=%s\n' "${uv_executable}" >> "${GITHUB_ENV}"
          "${uv_executable}" --version
          python -m pip install --user -r requirements-python-tools.txt

      - name: Run the canonical root verification gate
        run: ./check.sh --no-daemon --console=plain

  prepare-published-bundle-smoke-matrix:
    name: Prepare published bundle smoke matrix
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 10

    outputs:
      bundle-matrix-json: ${{ steps.release-plan.outputs.bundle-matrix-json }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Render canonical published bundle smoke matrix
        id: release-plan
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          [ -n "${version}" ]
          plan_json="$(
            python3 scripts/read-release-publication-plan.py \
              --version "${version}"
          )"
          printf 'bundle-matrix-json=%s\n' "$(printf '%s' "${plan_json}" | jq -c '.bundleBuildMatrix')" >> "$GITHUB_OUTPUT"

  published-bundle-smoke:
    name: Published bundle smoke (${{ matrix.classifier }})
    runs-on: ${{ matrix.runner }}
    needs:
      - check
      - prepare-published-bundle-smoke-matrix
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-published-bundle-smoke-matrix.outputs.bundle-matrix-json) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep '^fingrindJavaVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${java_version}" ]
          [ -n "${python_version}" ]
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-python-tools.txt

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure MSVC developer command environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-msvc-dev-cmd.ps1 -Arch x64

      - name: Configure Windows Defender build exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\configure-windows-defender-build-exclusions.ps1 `
            -WorkspacePath "${{ github.workspace }}" `
            -GradleUserHome "$env:USERPROFILE\.gradle"

      - name: Install repo-owned Python tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uvVersionLine = Select-String -Path gradle/fingrind-build.properties -Pattern '^fingrindUvVersion='
          if (-not $uvVersionLine) {
            throw 'missing fingrindUvVersion in gradle/fingrind-build.properties'
          }
          $uvVersion = $uvVersionLine.Line.Split('=')[1]
          python -m pip install --user "uv==$uvVersion"
          $uvBinDir = python -c "import sysconfig; print(sysconfig.get_path('scripts', scheme=sysconfig.get_preferred_scheme('user')))"
          $uvExecutable = Join-Path $uvBinDir 'uv.exe'
          if (-not (Test-Path $uvExecutable)) {
            throw "uv executable was not installed at $uvExecutable"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $uvBinDir
          Add-Content -Path $env:GITHUB_ENV -Value "ORG_GRADLE_PROJECT_fingrindUvExecutable=$uvExecutable"
          & $uvExecutable --version
          python -m pip install --user -r requirements-python-tools.txt

      - name: Verify Unix runner identity matches bundle target
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 ./scripts/verify-runner-identity.py \
            --expected-os-id '${{ matrix.operatingSystemId }}' \
            --expected-arch-id '${{ matrix.architectureId }}' \
            --actual-os-name "$(uname -s)" \
            --actual-architecture "$(uname -m)"

      - name: Verify Windows runner identity matches bundle target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $IsWindows) {
            throw "Expected a Windows runner"
          }
          $actualArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          python .\scripts\verify-runner-identity.py `
            --expected-os-id '${{ matrix.operatingSystemId }}' `
            --expected-arch-id '${{ matrix.architectureId }}' `
            --actual-os-name Windows `
            --actual-architecture $actualArch

      - name: Run included build-logic tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat -p gradle\build-logic test --no-daemon --console=plain

      - name: Verify managed SQLite CLI runtimes on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/verify-source-checkout-sqlite-runtime.sh
          ./scripts/verify-direct-java-sqlite-runtime.sh

      - name: Verify direct-Java SQLite CLI runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-direct-java-sqlite-runtime.ps1

      - name: Verify source-checkout SQLite CLI runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-source-checkout-sqlite-runtime.ps1

      - name: Build published Unix CLI bundle
        if: runner.os != 'Windows'
        id: unix-bundle-build
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/gradle-wrapper-support.sh
          is_darwin=false
          case "$(uname -s)" in
            Darwin) is_darwin=true ;;
          esac
          manifest_path="$(fg_gradle_bundle_archive_manifest_path "$PWD" 'cli' "${is_darwin}")"
          ./gradlew :cli:bundleCliArchive \
            -PfingrindBundleClassifier=${{ matrix.classifier }} \
            --no-daemon \
            --console=plain
          archive_path="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["archivePath"])' \
              "${manifest_path}"
          )"
          checksum_path="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checksumPath"])' \
              "${manifest_path}"
          )"
          printf 'archive-path=%s\n' "${archive_path}" >> "$GITHUB_OUTPUT"
          printf 'checksum-path=%s\n' "${checksum_path}" >> "$GITHUB_OUTPUT"

      - name: Build self-contained Windows CLI bundle
        if: runner.os == 'Windows'
        id: windows-bundle-build
        shell: pwsh
        run: |
          . .\scripts\gradle-wrapper-support.ps1
          $manifestPath = Get-FinGrindBundleArchiveManifestPath `
            -RepositoryRoot (Get-Location).Path `
            -ProjectSegment 'cli'
          & .\gradlew.bat :cli:bundleCliArchive `
            -PfingrindBundleClassifier=${{ matrix.classifier }} `
            --no-daemon `
            --console=plain
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "bundleCliArchive failed with exit code $exitCode"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $archivePath = [string]$manifest.archivePath
          $checksumPath = [string]$manifest.checksumPath
          if ([string]::IsNullOrWhiteSpace($archivePath) -or [string]::IsNullOrWhiteSpace($checksumPath)) {
            throw "bundleCliArchive manifest did not declare archive and checksum paths"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "archive-path=$archivePath"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "checksum-path=$checksumPath"

      - name: Smoke test the published Unix CLI bundle on the host runner
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/bundle-smoke.sh "${{ steps.unix-bundle-build.outputs.archive-path }}"

      - name: Smoke test the published Linux CLI bundle on the compatibility floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./scripts/bundle-smoke.sh \
            "${{ steps.unix-bundle-build.outputs.archive-path }}" \
            --execution-surface compatibility-floor

      - name: Smoke test the Windows CLI bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\bundle-smoke.ps1 "${{ steps.windows-bundle-build.outputs.archive-path }}"

  devcontainer-changes:
    name: Detect devcontainer changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect devcontainer-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" -- \
            '.devcontainer' \
            'scripts/validate-devcontainer.sh' \
            'scripts/devcontainer-prepare-user-home.sh' \
            'scripts/repo-verification-lock-support.sh' \
            'scripts/python-runtime-support.sh')
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  devcontainer:
    name: Contributor devcontainer
    needs: [devcontainer-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Record no-op contributor devcontainer verification
        if: needs.devcontainer-changes.outputs.changed != 'true'
        run: echo "No devcontainer-relevant changes detected; contributor devcontainer verification is a clean no-op."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.devcontainer-changes.outputs.changed == 'true'

      - name: Resolve Python toolchain version
        id: build-metadata
        if: needs.devcontainer-changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${python_version}" ]
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: needs.devcontainer-changes.outputs.changed == 'true'
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: needs.devcontainer-changes.outputs.changed == 'true'

      - name: Validate the committed contributor devcontainer surface
        if: needs.devcontainer-changes.outputs.changed == 'true'
        run: ./scripts/validate-devcontainer.sh

  gate:
    name: Gate
    if: always()
    needs:
      - check
      - prepare-published-bundle-smoke-matrix
      - published-bundle-smoke
      - devcontainer-changes
      - devcontainer
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Confirm aggregate gate success
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          if not isinstance(results, list) or not results:
              print("Release-blocking CI results did not resolve to one non-empty JSON array.")
              sys.exit(1)
          if any(result != "success" for result in results):
              print("Every release-blocking CI owner must conclude with success.")
              print("Observed:", results)
              sys.exit(1)
          PY
          echo "Every release-blocking CI owner concluded with success."
