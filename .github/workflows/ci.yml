name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep '^fingrindJavaVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${java_version}" ]
          [ -n "${python_version}" ]
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-python-tools.txt

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # On PRs, only read from the cache to avoid cache poisoning from untrusted code.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install repo-owned Python tools
        shell: bash
        run: |
          set -euo pipefail
          uv_version="$(grep '^fingrindUvVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${uv_version}" ]
          python -m pip install --user "uv==${uv_version}"
          uv_bin_dir="$(python - <<'PY'
          import sysconfig
          print(sysconfig.get_path("scripts", scheme=sysconfig.get_preferred_scheme("user")))
          PY
          )"
          printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
          uv_executable="${uv_bin_dir}/uv"
          printf 'ORG_GRADLE_PROJECT_fingrindUvExecutable=%s\n' "${uv_executable}" >> "${GITHUB_ENV}"
          "${uv_executable}" --version
          python -m pip install --user -r requirements-python-tools.txt

      - name: Run the canonical root verification gate
        run: ./check.sh --no-daemon --console=plain

  windows-nonpublic-bundle-smoke:
    name: Windows non-public bundle smoke
    runs-on: windows-2022
    needs: check
    continue-on-error: true
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep '^fingrindJavaVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${java_version}" ]
          [ -n "${python_version}" ]
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-python-tools.txt

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure MSVC developer command environment
        shell: pwsh
        run: .\scripts\setup-msvc-dev-cmd.ps1 -Arch x64

      - name: Configure Windows Defender build exclusions
        shell: pwsh
        run: |
          .\scripts\configure-windows-defender-build-exclusions.ps1 `
            -WorkspacePath "${{ github.workspace }}" `
            -GradleUserHome "$env:USERPROFILE\.gradle"

      - name: Install repo-owned Python tools
        shell: pwsh
        run: |
          $uvVersionLine = Select-String -Path gradle/fingrind-build.properties -Pattern '^fingrindUvVersion='
          if (-not $uvVersionLine) {
            throw 'missing fingrindUvVersion in gradle/fingrind-build.properties'
          }
          $uvVersion = $uvVersionLine.Line.Split('=')[1]
          python -m pip install --user "uv==$uvVersion"
          $uvBinDir = python -c "import sysconfig; print(sysconfig.get_path('scripts', scheme=sysconfig.get_preferred_scheme('user')))"
          $uvExecutable = Join-Path $uvBinDir 'uv.exe'
          if (-not (Test-Path $uvExecutable)) {
            throw "uv executable was not installed at $uvExecutable"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $uvBinDir
          Add-Content -Path $env:GITHUB_ENV -Value "ORG_GRADLE_PROJECT_fingrindUvExecutable=$uvExecutable"
          & $uvExecutable --version
          python -m pip install --user -r requirements-python-tools.txt

      - name: Run included build-logic tests on Windows
        shell: pwsh
        run: .\gradlew.bat -p gradle\build-logic test --no-daemon --console=plain

      - name: Verify direct-Java SQLite CLI runtime on Windows
        shell: pwsh
        run: .\scripts\verify-direct-java-sqlite-runtime.ps1

      - name: Verify source-checkout SQLite CLI runtime on Windows
        shell: pwsh
        run: .\scripts\verify-source-checkout-sqlite-runtime.ps1

      - name: Build self-contained Windows CLI bundle
        shell: pwsh
        run: .\gradlew.bat :cli:bundleCliArchive -PfingrindBundleClassifier=windows-x86_64 --no-daemon --console=plain

      - name: Smoke test the Windows CLI bundle
        shell: pwsh
        run: .\scripts\bundle-smoke.ps1

  published-unix-bundle-smoke:
    name: Published bundle smoke (${{ matrix.classifier }})
    runs-on: ${{ matrix.runner }}
    needs: check
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            classifier: linux-x86_64
            expected_os: Linux
            expected_arch: x86_64
          - runner: ubuntu-24.04-arm
            classifier: linux-aarch64
            expected_os: Linux
            expected_arch: aarch64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep '^fingrindJavaVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${java_version}" ]
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Unix runner identity matches bundle target
        shell: bash
        run: |
          set -euo pipefail
          actual_os="$(uname -s)"
          actual_arch="$(uname -m)"
          [ "${actual_os}" = "${{ matrix.expected_os }}" ] || {
            echo "Expected OS ${{ matrix.expected_os }} but runner reported ${actual_os}"
            exit 1
          }
          [ "${actual_arch}" = "${{ matrix.expected_arch }}" ] || {
            echo "Expected arch ${{ matrix.expected_arch }} but runner reported ${actual_arch}"
            exit 1
          }

      - name: Build published Unix CLI bundle
        id: bundle-build
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/gradle-wrapper-support.sh
          is_darwin=false
          case "$(uname -s)" in
            Darwin) is_darwin=true ;;
          esac
          manifest_path="$(fg_gradle_bundle_archive_manifest_path "$PWD" 'cli' "${is_darwin}")"
          ./gradlew :cli:bundleCliArchive \
            -PfingrindBundleClassifier=${{ matrix.classifier }} \
            --no-daemon \
            --console=plain
          archive_path="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["archivePath"])' \
              "${manifest_path}"
          )"
          checksum_path="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checksumPath"])' \
              "${manifest_path}"
          )"
          printf 'archive-path=%s\n' "${archive_path}" >> "$GITHUB_OUTPUT"
          printf 'checksum-path=%s\n' "${checksum_path}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the published Unix CLI bundle
        shell: bash
        run: ./scripts/bundle-smoke.sh "${{ steps.bundle-build.outputs.archive-path }}"

  devcontainer-changes:
    name: Detect devcontainer changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect devcontainer-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" -- \
            '.devcontainer' \
            'scripts/validate-devcontainer.sh' \
            'scripts/devcontainer-prepare-user-home.sh' \
            'scripts/repo-verification-lock-support.sh' \
            'scripts/python-runtime-support.sh')
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  devcontainer:
    name: Contributor devcontainer
    needs: [devcontainer-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Record no-op contributor devcontainer verification
        if: needs.devcontainer-changes.outputs.changed != 'true'
        run: echo "No devcontainer-relevant changes detected; contributor devcontainer verification is a clean no-op."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.devcontainer-changes.outputs.changed == 'true'

      - name: Resolve Python toolchain version
        id: build-metadata
        if: needs.devcontainer-changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${python_version}" ]
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: needs.devcontainer-changes.outputs.changed == 'true'
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: needs.devcontainer-changes.outputs.changed == 'true'

      - name: Validate the committed contributor devcontainer surface
        if: needs.devcontainer-changes.outputs.changed == 'true'
        run: ./scripts/validate-devcontainer.sh

  gate:
    name: Gate
    if: always()
    needs:
      - check
      - published-unix-bundle-smoke
      - devcontainer-changes
      - devcontainer
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Confirm aggregate gate success
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          if not isinstance(results, list) or not results:
              print("Release-blocking CI results did not resolve to one non-empty JSON array.")
              sys.exit(1)
          if any(result != "success" for result in results):
              print("Every release-blocking CI owner must conclude with success.")
              print("Observed:", results)
              sys.exit(1)
          PY
          echo "Every release-blocking CI owner concluded with success."
