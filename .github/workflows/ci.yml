name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          zulu_version="$(grep '^fingrindZuluVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${zulu_version}" ]
          [ -n "${python_version}" ]
          echo "java-version=${zulu_version}" >> "$GITHUB_OUTPUT"
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-python-tools.txt
            requirements-release-smoke-workflow.txt

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # On PRs, only read from the cache to avoid cache poisoning from untrusted code.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install repo-owned Python tools
        shell: bash
        run: |
          set -euo pipefail
          uv_version="$(grep '^fingrindUvVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${uv_version}" ]
          python -m pip install --user "uv==${uv_version}"
          uv_bin_dir="$(python - <<'PY'
          import sysconfig
          print(sysconfig.get_path("scripts", scheme=sysconfig.get_preferred_scheme("user")))
          PY
          )"
          printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
          uv_executable="${uv_bin_dir}/uv"
          printf 'ORG_GRADLE_PROJECT_fingrindUvExecutable=%s\n' "${uv_executable}" >> "${GITHUB_ENV}"
          "${uv_executable}" --version
          "${uv_executable}" pip install --system \
            -r requirements-python-tools.txt \
            -r requirements-release-smoke-workflow.txt

      - name: Provision pinned PowerShell runtime for mandatory Windows-contract preflight
        shell: bash
        run: |
          set -euo pipefail
          pwsh_executable="$(
            python scripts/provision-powershell-runtime.py \
              --install-root "${RUNNER_TEMP}/fingrind-powershell"
          )"
          required_pwsh_version="$(
            python scripts/provision-powershell-runtime.py --print-version
          )"
          actual_pwsh_version="$(
            "${pwsh_executable}" -NoLogo -NoProfile -NonInteractive \
              -Command '$PSVersionTable.PSVersion.ToString()'
          )"
          [[ "${actual_pwsh_version}" == "${required_pwsh_version}" ]]
          printf '%s\n' "$(dirname "${pwsh_executable}")" >> "${GITHUB_PATH}"
          printf 'FINGRIND_PWSH_EXECUTABLE=%s\n' "${pwsh_executable}" >> "${GITHUB_ENV}"

      - name: Run the canonical root verification gate
        run: ./check.sh --no-daemon --console=plain

  published-bundle-smoke:
    name: Published bundle smoke (${{ matrix.classifier }})
    runs-on: ${{ matrix.runner }}
    # Linux additionally proves the compatibility-floor field matrix after the host field test;
    # hosted measurements require the same bounded budget as the standalone bundle canary.
    timeout-minutes: 80

    strategy:
      fail-fast: false
      matrix:
        # This is the runner-admission boundary. It remains literal workflow policy rather
        # than data rendered by a PR-controlled checkout before GitHub resolves runs-on.
        include:
          - runner: macos-15
            classifier: macos-aarch64
            archiveExtension: tar.gz
            operatingSystemId: macos
            architectureId: aarch64
          - runner: macos-15-intel
            classifier: macos-x86_64
            archiveExtension: tar.gz
            operatingSystemId: macos
            architectureId: x86_64
          - runner: ubuntu-24.04
            classifier: linux-x86_64
            archiveExtension: tar.gz
            operatingSystemId: linux
            architectureId: x86_64
          - runner: ubuntu-24.04-arm
            classifier: linux-aarch64
            archiveExtension: tar.gz
            operatingSystemId: linux
            architectureId: aarch64
          - runner: windows-2022
            classifier: windows-x86_64
            archiveExtension: zip
            operatingSystemId: windows
            architectureId: x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          zulu_version="$(grep '^fingrindZuluVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${zulu_version}" ]
          [ -n "${python_version}" ]
          echo "java-version=${zulu_version}" >> "$GITHUB_OUTPUT"
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-python-tools.txt
            requirements-release-smoke-workflow.txt

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # Published platform proof jobs only consume cache state, so they can start independently.
          cache-read-only: true

      - name: Install repo-owned Python tools on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          uv_version="$(grep '^fingrindUvVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${uv_version}" ]
          python3 -m pip install --user "uv==${uv_version}"
          uv_bin_dir="$(python3 - <<'PY'
          import sysconfig
          print(sysconfig.get_path("scripts", scheme=sysconfig.get_preferred_scheme("user")))
          PY
          )"
          uv_executable="${uv_bin_dir}/uv"
          [ -x "${uv_executable}" ]
          printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
          printf 'ORG_GRADLE_PROJECT_fingrindUvExecutable=%s\n' "${uv_executable}" >> "${GITHUB_ENV}"
          "${uv_executable}" --version
          "${uv_executable}" pip install --system \
            -r requirements-python-tools.txt \
            -r requirements-release-smoke-workflow.txt

      - name: Provision pinned PowerShell runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $provisionedLines = @(python .\scripts\provision-powershell-runtime.py --install-root "$env:RUNNER_TEMP\fingrind-powershell")
          if ($LASTEXITCODE -ne 0 -or $provisionedLines.Count -ne 1) {
            throw 'could not provision exactly one pinned PowerShell executable'
          }
          $pwshExecutable = $provisionedLines[0].Trim()
          if ([string]::IsNullOrWhiteSpace($pwshExecutable) -or
              -not (Test-Path -LiteralPath $pwshExecutable -PathType Leaf)) {
            throw 'PowerShell provisioner did not return an existing executable'
          }
          $pwshDirectory = Split-Path -Path $pwshExecutable -Parent
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $pwshDirectory
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "FINGRIND_PWSH_EXECUTABLE=$pwshExecutable"
          $requiredVersionLines = @(python .\scripts\provision-powershell-runtime.py --print-version)
          if ($LASTEXITCODE -ne 0 -or $requiredVersionLines.Count -ne 1) {
            throw 'could not read exactly one canonical PowerShell version'
          }
          $requiredVersion = $requiredVersionLines[0].Trim()
          $actualVersionLines = @(& $pwshExecutable -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()')
          if ($LASTEXITCODE -ne 0 -or $actualVersionLines.Count -ne 1) {
            throw 'the provisioned PowerShell executable did not report exactly one version'
          }
          if ($actualVersionLines[0].Trim() -ne $requiredVersion) {
            throw "the provisioned PowerShell version does not match the canonical pin: expected $requiredVersion"
          }

      - name: Configure MSVC developer command environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:FINGRIND_PWSH_EXECUTABLE `
            -NoLogo `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\scripts\setup-msvc-dev-cmd.ps1 `
            -Arch x64
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure Windows Defender build exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:FINGRIND_PWSH_EXECUTABLE `
            -NoLogo `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\scripts\configure-windows-defender-build-exclusions.ps1 `
            -WorkspacePath "${{ github.workspace }}" `
            -GradleUserHome "$env:USERPROFILE\.gradle"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install repo-owned Python tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uvVersionLine = Select-String -Path gradle/fingrind-build.properties -Pattern '^fingrindUvVersion='
          if (-not $uvVersionLine) {
            throw 'missing fingrindUvVersion in gradle/fingrind-build.properties'
          }
          $uvVersion = $uvVersionLine.Line.Split('=')[1]
          python -m pip install --user "uv==$uvVersion"
          $uvBinDir = python -c "import sysconfig; print(sysconfig.get_path('scripts', scheme=sysconfig.get_preferred_scheme('user')))"
          $uvExecutable = Join-Path $uvBinDir 'uv.exe'
          if (-not (Test-Path $uvExecutable)) {
            throw "uv executable was not installed at $uvExecutable"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $uvBinDir
          Add-Content -Path $env:GITHUB_ENV -Value "ORG_GRADLE_PROJECT_fingrindUvExecutable=$uvExecutable"
          & $uvExecutable --version
          & $uvExecutable pip install --system `
            -r requirements-python-tools.txt `
            -r requirements-release-smoke-workflow.txt

      - name: Verify Unix runner identity matches bundle target
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 ./scripts/verify-runner-identity.py \
            --expected-os-id '${{ matrix.operatingSystemId }}' \
            --expected-arch-id '${{ matrix.architectureId }}' \
            --actual-os-name "$(uname -s)" \
            --actual-architecture "$(uname -m)"

      - name: Prove canonical attestation codec determinism on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :core:test \
            --tests 'dev.erst.fingrind.core.attestation.*' \
            --no-daemon \
            --console=plain

      - name: Verify managed SQLite CLI runtimes on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/verify-source-checkout-sqlite-runtime.sh
          ./scripts/verify-direct-java-sqlite-runtime.sh

      - name: Verify native Windows publication surface
        if: runner.os == 'Windows'
        id: windows-publication-proof
        shell: pwsh
        run: |
          & $env:FINGRIND_PWSH_EXECUTABLE `
            -NoLogo `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\scripts\verify-windows-publication-surface.ps1 `
            -RepositoryRoot "${{ github.workspace }}" `
            -WorkflowHelperRoot "${{ github.workspace }}" `
            -ExpectedOperatingSystemId '${{ matrix.operatingSystemId }}' `
            -ExpectedArchitectureId '${{ matrix.architectureId }}' `
            -BundleClassifier '${{ matrix.classifier }}' `
            -PowerShellExecutable $env:FINGRIND_PWSH_EXECUTABLE `
            -OutputFile $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build published Unix CLI bundle
        if: runner.os != 'Windows'
        id: unix-bundle-build
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/gradle-wrapper-support.sh
          is_darwin=false
          case "$(uname -s)" in
            Darwin) is_darwin=true ;;
          esac
          manifest_path="$(fg_gradle_bundle_archive_manifest_path "$PWD" 'cli' "${is_darwin}")"
          ./gradlew :cli:bundleCliArchive \
            -PfingrindBundleClassifier=${{ matrix.classifier }} \
            --no-daemon \
            --console=plain
          archive_path="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["archivePath"])' \
              "${manifest_path}"
          )"
          checksum_path="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checksumPath"])' \
              "${manifest_path}"
          )"
          printf 'archive-path=%s\n' "${archive_path}" >> "$GITHUB_OUTPUT"
          printf 'checksum-path=%s\n' "${checksum_path}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the published Unix CLI bundle on the host runner
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/bundle-smoke.sh "${{ steps.unix-bundle-build.outputs.archive-path }}"

      - name: Smoke test the published Linux CLI bundle on the compatibility floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./scripts/bundle-smoke.sh \
            "${{ steps.unix-bundle-build.outputs.archive-path }}" \
            --execution-surface compatibility-floor

      - name: Write sanitized Windows failure evidence
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        env:
          FINGRIND_WINDOWS_FAILURE_EVIDENCE_DIR: ${{ runner.temp }}\fingrind-windows-failure-evidence
          FINGRIND_WINDOWS_FAILURE_EVIDENCE_ROOT: ${{ runner.temp }}
        run: |
          # This diagnostic runs in the runner-provided shell, not the pinned build runtime: a
          # failed build may have been able to alter its own temporary runtime directory.
          & .\scripts\write-windows-failure-evidence.ps1 `
            -RepositoryRoot "${{ github.workspace }}" `
            -EvidenceDirectory $env:FINGRIND_WINDOWS_FAILURE_EVIDENCE_DIR `
            -TrustedEvidenceRoot $env:FINGRIND_WINDOWS_FAILURE_EVIDENCE_ROOT `
            -CommitSha "${{ github.sha }}" `
            -RunId "${{ github.run_id }}"

      - name: Upload sanitized Windows failure evidence
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-failure-evidence-${{ matrix.classifier }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\fingrind-windows-failure-evidence\fingrind-windows-failure-evidence.json
          if-no-files-found: error
          retention-days: 7

  devcontainer-changes:
    name: Detect devcontainer changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect devcontainer-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" -- \
            '.dockerignore' \
            '.devcontainer' \
            'scripts/validate-devcontainer.sh' \
            'scripts/devcontainer-prepare-user-home.sh' \
            'scripts/repo-verification-lock-support.sh' \
            'scripts/python-runtime-support.sh' \
            'scripts/provision-powershell-runtime.py' \
            'scripts/powershell_provisioning_cli.py' \
            'scripts/powershell_provisioning_tree.py' \
            'scripts/powershell_runtime.py' \
            'scripts/powershell_runtime_archives.py' \
            'scripts/powershell_runtime_cache.py' \
            'scripts/powershell_runtime_installation.py' \
            'scripts/powershell_runtime_metadata.py' \
            'scripts/powershell_runtime_models.py' \
            'gradle/fingrind-build.properties')
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  devcontainer:
    name: Contributor devcontainer
    needs: [devcontainer-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Record no-op contributor devcontainer verification
        if: needs.devcontainer-changes.outputs.changed != 'true'
        run: echo "No devcontainer-relevant changes detected; contributor devcontainer verification is a clean no-op."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.devcontainer-changes.outputs.changed == 'true'

      - name: Resolve Python toolchain version
        id: build-metadata
        if: needs.devcontainer-changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${python_version}" ]
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.devcontainer-changes.outputs.changed == 'true'
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: needs.devcontainer-changes.outputs.changed == 'true'

      - name: Validate the committed contributor devcontainer surface
        if: needs.devcontainer-changes.outputs.changed == 'true'
        run: ./scripts/validate-devcontainer.sh

  gate:
    name: Gate
    if: always()
    needs:
      - wrapper-validation
      - check
      - published-bundle-smoke
      - devcontainer-changes
      - devcontainer
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Confirm aggregate gate success
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          if not isinstance(results, list) or not results:
              print("Release-blocking CI results did not resolve to one non-empty JSON array.")
              sys.exit(1)
          if any(result != "success" for result in results):
              print("Every release-blocking CI owner must conclude with success.")
              print("Observed:", results)
              sys.exit(1)
          PY
          echo "Every release-blocking CI owner concluded with success."
