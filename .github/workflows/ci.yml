name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep '^fingrindJavaVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${java_version}" ]
          [ -n "${python_version}" ]
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-python-tools.txt

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # On PRs, only read from the cache to avoid cache poisoning from untrusted code.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install repo-owned Python tools
        shell: bash
        run: |
          set -euo pipefail
          uv_version="$(grep '^fingrindUvVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${uv_version}" ]
          python -m pip install --user "uv==${uv_version}"
          uv_bin_dir="$(python - <<'PY'
          import sysconfig
          print(sysconfig.get_path("scripts", scheme=sysconfig.get_preferred_scheme("user")))
          PY
          )"
          printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
          uv_executable="${uv_bin_dir}/uv"
          printf 'ORG_GRADLE_PROJECT_fingrindUvExecutable=%s\n' "${uv_executable}" >> "${GITHUB_ENV}"
          "${uv_executable}" --version
          python -m pip install --user -r requirements-python-tools.txt

      - name: Run the canonical root verification gate
        run: ./check.sh --no-daemon --console=plain

  windows-bundle-smoke:
    name: Windows bundle smoke
    runs-on: windows-2022
    needs: check
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Java toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep '^fingrindJavaVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${java_version}" ]
          [ -n "${python_version}" ]
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ steps.build-metadata.outputs.java-version }}
          distribution: 'zulu'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-python-tools.txt

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure MSVC developer command environment
        shell: pwsh
        run: .\scripts\setup-msvc-dev-cmd.ps1 -Arch x64

      - name: Configure Windows Defender build exclusions
        shell: pwsh
        run: |
          .\scripts\configure-windows-defender-build-exclusions.ps1 `
            -WorkspacePath "${{ github.workspace }}" `
            -GradleUserHome "$env:USERPROFILE\.gradle"

      - name: Install repo-owned Python tools
        shell: pwsh
        run: |
          $uvVersionLine = Select-String -Path gradle/fingrind-build.properties -Pattern '^fingrindUvVersion='
          if (-not $uvVersionLine) {
            throw 'missing fingrindUvVersion in gradle/fingrind-build.properties'
          }
          $uvVersion = $uvVersionLine.Line.Split('=')[1]
          python -m pip install --user "uv==$uvVersion"
          $uvBinDir = python -c "import sysconfig; print(sysconfig.get_path('scripts', scheme=sysconfig.get_preferred_scheme('user')))"
          $uvExecutable = Join-Path $uvBinDir 'uv.exe'
          if (-not (Test-Path $uvExecutable)) {
            throw "uv executable was not installed at $uvExecutable"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $uvBinDir
          Add-Content -Path $env:GITHUB_ENV -Value "ORG_GRADLE_PROJECT_fingrindUvExecutable=$uvExecutable"
          & $uvExecutable --version
          python -m pip install --user -r requirements-python-tools.txt

      - name: Run root quality gates on Windows
        shell: pwsh
        run: .\gradlew.bat check --no-daemon --console=plain

      - name: Run included build-logic tests on Windows
        shell: pwsh
        run: .\gradlew.bat -p gradle\build-logic test --no-daemon --console=plain

      - name: Verify direct-Java SQLite CLI runtime on Windows
        shell: pwsh
        run: .\scripts\verify-direct-java-sqlite-runtime.ps1

      - name: Verify source-checkout SQLite CLI runtime on Windows
        shell: pwsh
        run: .\scripts\verify-source-checkout-sqlite-runtime.ps1

      - name: Build self-contained Windows CLI bundle
        shell: pwsh
        run: .\gradlew.bat :cli:bundleCliArchive -PfingrindBundleClassifier=windows-x86_64 --no-daemon --console=plain

      - name: Smoke test the Windows CLI bundle
        shell: pwsh
        run: .\scripts\bundle-smoke.ps1

  devcontainer-changes:
    name: Detect devcontainer changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect devcontainer-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" -- \
            '.devcontainer' \
            'scripts/validate-devcontainer.sh' \
            'scripts/devcontainer-prepare-user-home.sh' \
            'scripts/repo-verification-lock-support.sh' \
            'scripts/python-runtime-support.sh')
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  devcontainer:
    name: Contributor devcontainer
    needs: [devcontainer-changes]
    if: needs.devcontainer-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Python toolchain version
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(grep '^fingrindPythonVersion=' gradle/fingrind-build.properties | cut -d= -f2)"
          [ -n "${python_version}" ]
          echo "python-version=${python_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ steps.build-metadata.outputs.python-version }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Validate the committed contributor devcontainer surface
        run: ./scripts/validate-devcontainer.sh

  gate:
    name: Gate
    if: always()
    needs:
      - check
      - windows-bundle-smoke
      - devcontainer-changes
      - devcontainer
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Confirm aggregate gate success
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          if echo "$RESULTS" | grep -q '"failure"'; then
            echo "A required job failed."
            exit 1
          fi
          if echo "$RESULTS" | grep -q '"cancelled"'; then
            echo "A required job was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
